<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="checkout-container divider">
      <h2>Review & Place Your Order</h2>

      <form name="checkout" id="checkout-form" class="checkout-form">
        <fieldset>
          <legend>Shipping & Customer Info</legend>

          <div class="form-row">
            <div class="form-group">
              <label for="fname">First Name</label>
              <input type="text" id="fname" name="fname" required />
            </div>
            <div class="form-group">
              <label for="lname">Last Name</label>
              <input type="text" id="lname" name="lname" required />
            </div>
          </div>

          <div class="form-group">
            <label for="street">Street Address</label>
            <input type="text" id="street" name="street" required />
          </div>

          <div class="form-row form-row--3">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" name="city" required />
            </div>
            <div class="form-group">
              <label for="state">State</label>
              <input type="text" id="state" name="state" required />
            </div>
            <div class="form-group">
              <label for="zip">Zip Code</label>
              <input type="text" id="zip" name="zip" required />
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Payment Information</legend>

          <div class="form-group">
            <label for="cardNumber">Credit Card Number</label>
            <input
              type="text"
              id="cardNumber"
              name="cardNumber"
              value="1234123412341234"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="expiration">Expiration Date (MM/YY)</label>
              <input
                type="text"
                id="expiration"
                name="expiration"
                value="12/28"
                required
              />
            </div>
            <div class="form-group">
              <label for="code">Security Code (CVV)</label>
              <input type="text" id="code" name="code" value="123" required />
            </div>
          </div>
        </fieldset>

        <fieldset class="order-summary">
          <legend>Order Summary</legend>
          <p>
            <span>Item Subtotal (<span id="num-items">0</span>):</span>
            <span id="subtotal">$0.00</span>
          </p>
          <p>
            <span>Shipping Estimate:</span> <span id="shipping">$0.00</span>
          </p>
          <p><span>Tax (6%):</span> <span id="tax">$0.00</span></p>
          <hr class="summary-divider" />
          <p class="order-total-row">
            <strong>Order Total:</strong>
            <strong id="order-total">$0.00</strong>
          </p>
        </fieldset>

        <button type="submit" id="checkoutSubmit">Checkout</button>
      </form>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
